<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allinmyday Realtime 3D Prototype</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#02050b;color:#eaf8ff;font-family:system-ui,sans-serif}#stage{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:22px;left:24px;font-weight:800;letter-spacing:.05em}.brand small{display:block;font-size:10px;opacity:.6;margin-top:4px}.hint,.info{position:absolute;border:1px solid #23435c;border-radius:15px;background:#020a12bb;backdrop-filter:blur(12px);padding:10px 13px;font-size:11px}.hint{top:22px;right:24px}.info{left:50%;bottom:22px;transform:translateX(-50%);white-space:nowrap}.label{position:absolute;transform:translate(-50%,-50%);padding:6px 10px;border:1px solid currentColor;border-radius:999px;background:#020811b8;font-size:10px;white-space:nowrap;text-shadow:0 0 12px currentColor}.core{color:#69dcff}.finance{color:#ffbf63}.goals{color:#c49cff}.productivity{color:#76ef8c}.household{color:#66d7ff}.calendar{color:#ff9b6b}@media(max-width:700px){.brand{top:13px;left:15px;font-size:14px}.hint{top:13px;right:15px;font-size:9px;max-width:120px}.info{bottom:13px;font-size:9px;max-width:80vw;overflow:hidden;text-overflow:ellipsis}}</style></head>
<body><div id="stage"></div><div class="hud"><div class="brand">ALLINMYDAY<small>ONE SCREEN • ONE TAP • ONE INTELLIGENT LIFE</small></div><div class="hint">REALTIME 3D • DRAG • TAP A CORE</div><div id="info" class="info">Yansi Intelligence Core — ambient and ready.</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
const stage=document.querySelector('#stage'),info=document.querySelector('#info'),scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02050b,.035);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.set(0,3,13);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x31516f,1.8));const key=new THREE.PointLight(0x39bfff,35,24);key.position.set(0,4,4);scene.add(key);const rim=new THREE.PointLight(0x8a4dff,24,20);rim.position.set(-5,-1,-4);scene.add(rim);const root=new THREE.Group();scene.add(root);
const colors=[0xffbf63,0xc49cff,0x76ef8c,0x66d7ff,0xff9b6b],names=['Finance','Goals','Productivity','Household','Calendar'],positions=[[-4,1.5,0],[4,1.5,0],[-3,-2.2,.5],[0,-3,1],[3,-2.2,.5]],cores=[];
function orb(color,r=.8){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(r,40,40),new THREE.MeshPhysicalMaterial({color,emissive:color,emissiveIntensity:1.8,transparent:true,opacity:.34,roughness:.12,metalness:.2,transmission:.2})),new THREE.Mesh(new THREE.IcosahedronGeometry(r*.43,2),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:2.8,wireframe:true})));return g}
const yansi=orb(0x4fbfff,1.65);yansi.position.y=.35;root.add(yansi);const brain=new THREE.Mesh(new THREE.IcosahedronGeometry(.82,3),new THREE.MeshStandardMaterial({color:0x73e6ff,emissive:0x177dff,emissiveIntensity:2.2,wireframe:true}));yansi.add(brain);
for(let i=0;i<5;i++){const g=orb(colors[i],.78);g.position.set(...positions[i]);g.userData.name=names[i];root.add(g);cores.push(g)}
for(let r=2.3;r<=5.4;r+=1.55){const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,180),new THREE.MeshBasicMaterial({color:0x36baff,transparent:true,opacity:.48}));ring.rotation.x=Math.PI/2;ring.position.y=-.95;root.add(ring)}
for(let i=0;i<900;i++){const a=Math.random()*Math.PI*2,r=3+Math.pow(Math.random(),.45)*9;const p=new THREE.Vector3(Math.cos(a)*r,(Math.random()-.5)*5,Math.sin(a)*r);const m=new THREE.Mesh(new THREE.SphereGeometry(.018,4,4),new THREE.MeshBasicMaterial({color:0x54bfff,transparent:true,opacity:.65}));m.position.copy(p);scene.add(m)}
function line(a,b,c){const mid=a.clone().lerp(b,.5);mid.y+=.7;const curve=new THREE.QuadraticBezierCurve3(a,mid,b);return new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.6}))}cores.forEach((g,i)=>root.add(line(yansi.position,g.position,colors[i])));
const labels=names.map((n,i)=>{const e=document.createElement('div');e.className='label '+n.toLowerCase();e.textContent=n;document.querySelector('.hud').appendChild(e);return e}),coreLabel=document.createElement('div');coreLabel.className='label core';coreLabel.textContent='YANSI';document.querySelector('.hud').appendChild(coreLabel);
let targetX=0,targetY=0,rx=0,ry=0,drag=false,lx=0,ly=0;renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};window.onpointerup=()=>drag=false;window.onpointermove=e=>{if(!drag)return;targetY+=(e.clientX-lx)*.004;targetX+=(e.clientY-ly)*.003;targetX=Math.max(-.65,Math.min(.65,targetX));lx=e.clientX;ly=e.clientY};renderer.domElement.onclick=e=>{const mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(cores,true)[0];if(hit){let o=hit.object;while(o.parent&&!o.userData.name)o=o.parent;info.textContent=o.userData.name+' core selected — ready for live Allinmyday data.'}};
function project(o){const p=o.getWorldPosition(new THREE.Vector3()).project(camera);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight,z:p.z}}function animate(t){requestAnimationFrame(animate);const time=t*.001;ry+=(targetY-ry)*.08;rx+=(targetX-rx)*.08;root.rotation.y=ry;root.rotation.x=rx;yansi.rotation.y=time*.35;brain.rotation.x=time*.5;brain.rotation.y=-time*.7;yansi.scale.setScalar(1+Math.sin(time*2.1)*.035);cores.forEach((g,i)=>{g.rotation.y=time*(.3+i*.06);g.position.y=positions[i][1]+Math.sin(time*1.4+i)*.12});let p=project(yansi);coreLabel.style.left=p.x+'px';coreLabel.style.top=p.y+'px';cores.forEach((g,i)=>{p=project(g);labels[i].style.left=p.x+'px';labels[i].style.top=p.y+'px';labels[i].style.opacity=p.z<1?'1':'0'});renderer.render(scene,camera)}animate(0);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
