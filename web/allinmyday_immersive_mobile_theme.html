<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ALLINMYDAY Immersive 3D Mobile Theme</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;color:#eafcff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em}.top b{font-size:14px}.state{opacity:.65}.prompt{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;border:1px solid #2d7695;border-radius:999px;background:#020a12cc;font-size:9px;white-space:nowrap}.core{position:absolute;transform:translate(-50%,-50%);font-size:8px;letter-spacing:.14em;text-shadow:0 0 12px currentColor}.yansi{color:#71e9ff}.finance{color:#ffc45f}.goals{color:#8dff72}.tasks{color:#d28cff}.shopping{color:#ff9a62}.calendar{color:#68d8ff}.panel{position:absolute;left:14px;right:14px;bottom:58px;padding:13px;border:1px solid #245b73;border-radius:18px;background:#020a12dd;backdrop-filter:blur(8px);font-size:10px;display:none}.panel strong{font-size:12px}</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><b>ALLINMYDAY</b><span class="state">IMMERSIVE 3D • YANSI AMBIENT</span></div><div id="labels"></div><div id="panel" class="panel"></div><div class="prompt">DRAG TO LOOK • MOVE TOWARD A CORE • TAP TO ENTER</div></div><script>
'use strict';const cv=document.getElementById('world'),gl=cv.getContext('webgl',{antialias:true});if(!gl)throw Error('WebGL unavailable');
const vs='attribute vec3 p;uniform mat4 m;uniform float s;void main(){gl_Position=m*vec4(p,1.0);gl_PointSize=s;}';const fs='precision mediump float;uniform vec4 c;void main(){float d=distance(gl_PointCoord,vec2(.5));if(d>.5)discard;gl_FragColor=c;}';
function S(t,x){let q=gl.createShader(t);gl.shaderSource(q,x);gl.compileShader(q);return q}let pr=gl.createProgram();gl.attachShader(pr,S(gl.VERTEX_SHADER,vs));gl.attachShader(pr,S(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);let a=gl.getAttribLocation(pr,'p'),u=gl.getUniformLocation(pr,'m'),us=gl.getUniformLocation(pr,'s'),uc=gl.getUniformLocation(pr,'c'),buf=gl.createBuffer();
let W,H,yaw=0,pitch=0,down=false,lx=0,ly=0;function resize(){let d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;gl.viewport(0,0,W,H)}addEventListener('resize',resize);resize();
function mat(){let ar=W/H,f=1/Math.tan(Math.PI/6),n=.1,F=80,nf=1/(n-F);return new Float32Array([f/ar,0,0,0,0,f,0,0,0,0,(F+n)*nf,-1,0,0,2*F*n*nf,0])}
const cores=[['FINANCE',-4,2,0,'#ffc45f'],['GOALS',4,2,0,'#8dff72'],['TASKS',-3,-2.5,0,'#d28cff'],['SHOPPING',3,-2.5,0,'#ff9a62'],['CALENDAR',0,-4,0,'#68d8ff']];const labels=document.getElementById('labels');
cores.forEach((x,i)=>{let e=document.createElement('div');e.className='core '+['finance','goals','tasks','shopping','calendar'][i];e.textContent=x[0];labels.appendChild(e)});let y=document.createElement('div');y.className='core yansi';y.textContent='YANSI';labels.appendChild(y);const panel=document.getElementById('panel');
function project(x,y,z){let cy=Math.cos(yaw),sy=Math.sin(yaw),X=x*cy-z*sy,Z=x*sy+z*cy-12,Y=y;let cx=Math.cos(pitch),sx=Math.sin(pitch),YY=Y*cx-Z*sx,ZZ=Y*sx+Z*cx;let f=1/Math.tan(Math.PI/6),px=W/2+(X*f/(-ZZ))*(W/H)/2*H,py=H/2-(YY*f/(-ZZ))*H/2;return[px/W*100,py/H*100]}
function draw(x,y,z,c,size,t){let cy=Math.cos(yaw),sy=Math.sin(yaw),X=x*cy-z*sy,Z=x*sy+z*cy-12,Y=y,cx=Math.cos(pitch),sx=Math.sin(pitch),YY=Y*cx-Z*sx,ZZ=Y*sx+Z*cx;gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([X,YY,ZZ]),gl.STREAM_DRAW);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);gl.uniformMatrix4fv(u,false,mat());gl.uniform1f(us,size);gl.uniform4fv(uc,c);gl.drawArrays(gl.POINTS,0,1)}
function loop(t){requestAnimationFrame(loop);gl.clearColor(.004,.012,.025,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);let pulse=50+Math.sin(t*.002)*5;draw(0,0,0,[.25,.85,1,1],72);draw(0,0,0,[.55,1,1,.8],38+pulse*.08);
cores.forEach((q,i)=>{let cc=[[1,.77,.37,1],[.55,1,.45,1],[.8,.45,1,1],[1,.5,.3,1],[.35,.82,1,1]][i];draw(q[1],q[2],q[3],cc,34);draw(q[1],q[2],q[3],[cc[0],cc[1],cc[2],.28],62+Math.sin(t*.002+i)*5);});
for(let i=0;i<220;i++){let a=i*.31+t*.00008,r=6+(i%18)*.42;draw(Math.cos(a)*r,((i%17)-8)*.32,Math.sin(a)*r,[.25,.7,1,.22],2)}
let p=project(0,0,0);y.style.left=p[0]+'%';y.style.top=p[1]+'%';cores.forEach((q,i)=>{let p=project(q[1],q[2],q[3]),e=labels.children[i];e.style.left=p[0]+'%';e.style.top=p[1]+'%'});
}loop(0);
cv.onpointerdown=e=>{down=true;lx=e.clientX;ly=e.clientY};addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(!down)return;yaw+=(e.clientX-lx)*.004;pitch=Math.max(-.8,Math.min(.8,pitch+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY});cv.onclick=e=>{panel.style.display='block';panel.innerHTML='<strong>IMMERSIVE CORE</strong><br>Approach any core and enter its spatial LifeOS report. This surface is intentionally data-free until connected to the real app.'};
</script></body></html>
