<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALLINMYDAY OS — Native 3D Theme</title>
<style>
:root{--bg:#02050c;--cyan:#55eaff;--blue:#178cff;--violet:#9d73ff;--green:#55e39a;--gold:#ffc65a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#eafaff;font-family:system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:14px;font-weight:800;letter-spacing:.18em}.brand small{display:block;margin-top:4px;font-size:7px;letter-spacing:.12em;opacity:.55}.state{font-size:8px;letter-spacing:.12em;opacity:.7}.yansi{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 0 20px #32dfff}.yansi b{display:block;font-size:10px;letter-spacing:.4em}.yansi span{font-size:7px;opacity:.65}.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:9px;pointer-events:auto;padding:8px;border:1px solid #1d526c;border-radius:20px;background:#020a12cc;backdrop-filter:blur(10px)}.dock button{width:40px;height:40px;border:1px solid #244e63;border-radius:14px;background:#06131d;color:#9eeeff;font-size:16px}.report{position:absolute;left:16px;right:16px;bottom:84px;padding:11px 14px;text-align:center;border:1px solid #194760;border-radius:15px;background:#020a12c9;font-size:9px;opacity:.9}.hint{position:absolute;left:50%;top:calc(50% + 52px);transform:translateX(-50%);font-size:7px;letter-spacing:.13em;opacity:.45;white-space:nowrap}.core{position:absolute;transform:translate(-50%,-50%);padding:7px 10px;border-radius:20px;border:1px solid currentColor;background:#020a12c9;font-size:7px;letter-spacing:.13em;white-space:nowrap}.c0{left:19%;top:31%;color:var(--gold)}.c1{right:19%;top:31%;color:var(--violet)}.c2{left:18%;top:63%;color:var(--green)}.c3{right:18%;top:63%;color:var(--cyan)}.c4{left:50%;bottom:18%;color:#ff9b75}@media(min-width:800px){.c0{left:30%}.c1{right:30%}.c2{left:30%}.c3{right:30%}}
</style></head>
<body><canvas id="os"></canvas><div class="ui"><div class="top"><div class="brand">ALLINMYDAY<small>ONE LIFE • ONE OS • INFINITE POSSIBILITIES</small></div><div class="state">YANSI • AMBIENT READY</div></div><div class="yansi"><b>YANSI</b><span>LISTENING • UNDERSTANDING • READY</span></div><div class="core c0">FINANCE</div><div class="core c1">GOALS</div><div class="core c2">PRODUCTIVITY</div><div class="core c3">HOUSEHOLD</div><div class="core c4">CALENDAR</div><div class="hint">DRAG TO EXPLORE • TAP A CORE</div><div id="report" class="report">Your LifeOS environment is ready.</div><div class="dock"><button data-i="0">⌂</button><button data-i="1">◈</button><button data-i="2">✦</button><button data-i="3">◌</button><button data-i="4">⚙</button></div></div>
<script>
'use strict';
const canvas=document.getElementById('os'),gl=canvas.getContext('webgl',{antialias:true,alpha:false}),report=document.getElementById('report');
if(!gl){report.textContent='Native WebGL is unavailable on this device.';throw Error('WebGL unavailable')}
const V='attribute vec3 p;uniform mat4 mvp;uniform float size;void main(){gl_Position=mvp*vec4(p,1.);gl_PointSize=size;}';
const F='precision mediump float;uniform vec4 color;void main(){float d=distance(gl_PointCoord,vec2(.5));if(d>.5)discard;gl_FragColor=color;}';
function compile(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}const pr=gl.createProgram();gl.attachShader(pr,compile(gl.VERTEX_SHADER,V));gl.attachShader(pr,compile(gl.FRAGMENT_SHADER,F));gl.linkProgram(pr);gl.useProgram(pr);const pos=gl.getAttribLocation(pr,'p'),mvp=gl.getUniformLocation(pr,'mvp'),size=gl.getUniformLocation(pr,'size'),color=gl.getUniformLocation(pr,'color'),buf=gl.createBuffer();
let w=1,h=1,rx=.04,ry=0,drag=false,lx=0,ly=0;function resize(){const d=Math.min(devicePixelRatio||1,2);w=canvas.width=innerWidth*d;h=canvas.height=innerHeight*d;gl.viewport(0,0,w,h)}addEventListener('resize',resize);resize();
function matrix(){const a=w/h,f=1/Math.tan(Math.PI/6),n=.1,z=80,nf=1/(n-z);return new Float32Array([f/a,0,0,0,0,f,0,0,0,0,(z+n)*nf,-1,0,0,2*z*n*nf,0])}
function point(x,y,z,col,sz){const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let X=x*cy-z*sy,Z=x*sy+z*cy,Y=y;let Y2=Y*cx-Z*sx,Z2=Y*sx+Z*cx-14;gl.uniformMatrix4fv(mvp,false,matrix());gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([X,Y2,Z2]),gl.STREAM_DRAW);gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,0,0);gl.uniform4fv(color,col);gl.uniform1f(size,sz);gl.drawArrays(gl.POINTS,0,1)}
const cores=[[-4,2.5,0],[4,2.5,0],[-3.5,-2.4,0],[3.5,-2.4,0],[0,-4.2,0]],cols=[[1,.75,.35,1],[.65,.48,1,1],[.4,.95,.58,1],[.35,.85,1,1],[1,.48,.35,1]],names=['Finance','Goals','Productivity','Household','Calendar'];
function draw(t){requestAnimationFrame(draw);const s=t*.001;gl.clearColor(.006,.012,.027,1);gl.clear(gl.COLOR_BUFFER_BIT);ry+=(drag?0:.0007);point(0,0,0,[.2,.8,1,1],66+Math.sin(s*2)*4);point(0,0,0,[.45,.95,1,.8],34);
cores.forEach((q,i)=>{point(q[0],q[1],q[2],cols[i],25);point(q[0],q[1],q[2],cols[i].slice(0,3).concat(.25),48+Math.sin(s*1.8+i)*5);const a=s*.45+i*.8,r=1.1;point(q[0]+Math.cos(a)*r,q[1]+Math.sin(a)*r,.4,cols[i],6)});
for(let i=0;i<150;i++){const a=i*.41+s*.025,r=6+(i%14)*.55;point(Math.cos(a)*r,((i%17)-8)*.28,Math.sin(a)*r,[.25,.68,1,.24],2)} }
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.004;rx=Math.max(-.55,Math.min(.55,rx+(e.clientY-ly)*.002));lx=e.clientX;ly=e.clientY});
document.querySelectorAll('.core').forEach((e,i)=>e.addEventListener('click',()=>report.textContent=names[i]+' core selected — LifeOS report surface ready.'));document.querySelectorAll('.dock button').forEach(b=>b.addEventListener('click',()=>report.textContent=['OS home environment','LifeOS reports','Yansi intelligence','Ambient status','OS settings'][Number(b.dataset.i)]+' selected.'));draw(0);
</script></body></html>
