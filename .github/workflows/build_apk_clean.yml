name: Build LifeOS APK Clean

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LifeOS
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Remove generated sample test
        run: rm -rf test

      - name: Configure release build and LIFEOZ master launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'isMinifyEnabled = false' not in text:
              text = text.replace('release {\n', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n', 1)
          gradle.write_text(text)
          res = Path('android/app/src/main/res')
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'mipmap-anydpi-v26').mkdir(parents=True, exist_ok=True)
          (res / 'mipmap').mkdir(parents=True, exist_ok=True)
          # Master-reference LIFEOZ mark: organic gold vessel around a luminous blue intelligence core.
          fg = '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00000000" android:strokeColor="#F4B45F" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M54,8 C42,22 25,29 25,48 C25,68 42,84 54,99 C66,84 83,68 83,48 C83,29 66,22 54,8 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#D99545" android:strokeWidth="2.6" android:strokeLineCap="round" android:pathData="M54,18 C45,31 36,35 36,49 C36,61 45,70 54,80 C63,70 72,61 72,49 C72,35 63,31 54,18 Z"/>
            <path android:fillColor="#08213D" android:strokeColor="#35BFFF" android:strokeWidth="2.4" android:pathData="M54,30 A20,20 0,1 0,54,70 A20,20 0,1 0,54,30"/>
            <path android:fillColor="#1E9FE8" android:pathData="M54,36 A14,14 0,1 0,54,64 A14,14 0,1 0,54,36"/>
            <path android:fillColor="#8DEBFF" android:pathData="M54,43 A7,7 0,1 0,54,57 A7,7 0,1 0,54,43"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,47 A3,3 0,1 0,54,53 A3,3 0,1 0,54,47"/>
          </vector>'''
          (res / 'drawable/lifeoz_master_launcher_foreground.xml').write_text(fg)
          bg = '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#01030A"/></shape>'
          (res / 'drawable/lifeoz_master_launcher_background.xml').write_text(bg)
          adaptive = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/lifeoz_master_launcher_background"/><foreground android:drawable="@drawable/lifeoz_master_launcher_foreground"/></adaptive-icon>'
          (res / 'mipmap-anydpi-v26/ic_launcher_lifeoz_master.xml').write_text(adaptive)
          (res / 'mipmap-anydpi-v26/ic_launcher_lifeoz_master_round.xml').write_text(adaptive)
          (res / 'mipmap/ic_launcher_lifeoz_master.xml').write_text(fg)
          (res / 'mipmap/ic_launcher_lifeoz_master_round.xml').write_text(fg)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:label="[^"]*"', 'android:label="LifeOZ"', text, count=1)
          text = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher_lifeoz_master"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_lifeoz_master_round"', text, count=1)
          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build LifeOS APK
        run: flutter build apk --release --no-shrink

      - name: Upload LifeOS APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Yansi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
