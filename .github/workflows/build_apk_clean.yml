name: Build LifeOS APK Clean

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LifeOS
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Remove generated sample test
        run: rm -rf test

      - name: Configure release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'isMinifyEnabled = false' not in text:
              text = text.replace('release {\n', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n', 1)
          gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          import re
          text = re.sub(r'android:label="[^"]*"', 'android:label="LifeOZ"', text, count=1)
          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build LifeOS APK
        run: flutter build apk --release --no-shrink

      - name: Upload LifeOS APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Yansi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
