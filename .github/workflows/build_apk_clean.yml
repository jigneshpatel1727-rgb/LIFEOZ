name: Build AllInMyDay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AllInMyDay
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter build environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure release build and Allinmyday identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'isMinifyEnabled = false' not in text:
              text = text.replace('release {\n', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n', 1)
          gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:label="[^"]*"', 'android:label="Allinmyday"', text, count=1)
          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify dependency-free trial entrypoint
        run: flutter analyze lib/trial_main.dart

      - name: Build Allinmyday trial APK
        run: flutter build apk --release --no-shrink --target lib/trial_main.dart

      - name: Upload Allinmyday trial APK
        uses: actions/upload-artifact@v4
        with:
          name: Allinmyday-Trial-APK
          path: build/app/outputs/flutter-apk/app-release.apk
