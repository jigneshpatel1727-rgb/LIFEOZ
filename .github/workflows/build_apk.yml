name: Build LifeOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LifeOS
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/gradle-wrapper.properties', 'android/**/build.gradle*', 'android/**/settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          text = text.replace('isMinifyEnabled = true', 'isMinifyEnabled = false')
          text = text.replace('isShrinkResources = true', 'isShrinkResources = false')
          deps = '''

          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          '''
          if 'text-recognition-chinese:16.0.1' not in text:
              text += deps
          path.write_text(text)
          PY

      - name: Configure Yansi ambient Android runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = next(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          text = main.read_text()
          package = re.search(r'^package\s+([\w.]+)', text, re.MULTILINE).group(1)
          root = main.parent
          service = root / 'YansiBackgroundService.kt'
          service.write_text(f'''package {package}

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder

          class YansiBackgroundService : Service() {{
              companion object {{
                  private const val CHANNEL_ID = "yansi_ambient"
                  private const val NOTIFICATION_ID = 2408
              }}

              override fun onCreate() {{
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Yansi ambient AI",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }}
                  startForeground(NOTIFICATION_ID, buildNotification())
              }}

              private fun buildNotification(): Notification {{
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      Notification.Builder(this, CHANNEL_ID)
                  }} else {{
                      Notification.Builder(this)
                  }}
                  return builder
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("Yansi")
                      .setContentText("Ambient AI is active")
                      .setOngoing(true)
                      .build()
              }}

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }}
          '''.replace('          ', ''))

          imports = 'import io.flutter.embedding.android.FlutterActivity\\nimport io.flutter.embedding.engine.FlutterEngine\\nimport io.flutter.plugin.common.MethodChannel\\n'
          if 'MethodChannel' not in text:
              text = text.replace('import io.flutter.embedding.android.FlutterActivity\\n', imports)
          if 'lifeos/yansi_background' not in text:
              marker = 'class MainActivity : FlutterActivity() {{'
              replacement = '''class MainActivity : FlutterActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lifeos/yansi_background")
                      .setMethodCallHandler {{ call, result ->
                          val serviceIntent = Intent(this, YansiBackgroundService::class.java)
                          when (call.method) {{
                              "start" -> {{
                                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {{
                                      startForegroundService(serviceIntent)
                                  }} else {{
                                      startService(serviceIntent)
                                  }}
                                  result.success(true)
                              }}
                              "stop" -> {{
                                  result.success(stopService(serviceIntent))
                              }}
                              else -> result.notImplemented()
                          }}
                      }}
              }}'''
              text = text.replace(marker, replacement)
          main.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          for permission in [
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MICROPHONE',
          ]:
              tag = f'<uses-permission android:name="{permission}"/>'
              if tag not in m:
                  m = m.replace('<manifest ', '<manifest ', 1)
                  end = m.find('>', m.find('<manifest '))
                  m = m[:end + 1] + '\\n    ' + tag + m[end + 1:]
          if 'YansiBackgroundService' not in m:
              m = m.replace('</application>', '        <service android:name=".YansiBackgroundService" android:exported="false" android:foregroundServiceType="microphone" />\\n    </application>')
          manifest.write_text(m)
          PY

      - name: Configure microphone and speech recognition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
          if permission not in text:
              marker = '<manifest '
              index = text.find(marker)
              if index >= 0:
                  end = text.find('>', index)
                  text = text[:end + 1] + '\n    ' + permission + text[end + 1:]
          queries = '''\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService"/>\n        </intent>\n    </queries>'''
          if 'android.speech.RecognitionService' not in text:
              text = text.replace('</manifest>', queries + '\n</manifest>')
          path.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build LifeOS APK
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt of 3"
            if flutter build apk --release --no-shrink; then
              echo "APK build succeeded"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle/network failure. Waiting before retry..."
              rm -rf ~/.gradle/wrapper/dists
              sleep 15
            fi
          done
          echo "APK build failed after 3 attempts"
          exit 1

      - name: Upload LifeOS APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Yansi-Voice-APK
          path: build/app/outputs/flutter-apk/app-release.apk
